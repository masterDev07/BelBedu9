# file konfigurasi Monitor off
# Koreksi file konfigurasi jamon baris awal dan baris tengah ada tambahan 
# logika OR / "||" sedangkan baris akhir tidak ada
buat_pembataswaktuLebsam $pukulqomatShubuh $pukulselesaishalatshubuh ||
if [[ $nama_hari = Friday ]];then 
    buat_pembataswaktuLebsam $zhuhur $pukulselesaijumatan
else
    buat_pembataswaktuLebsam $pukulqomatZhuhur $pukulselesaishalatzhuhur
fi ||
buat_pembataswaktuLebsam $pukulqomatAshar $pukulselesaishalatashar ||
buat_pembataswaktuLebsam $pukulqomatMaghrib $pukulselesaishalatmaghrib ||
buat_pembataswaktuLebsam $pukulqomatIsya $pukulselesaishalatisya || 
buat_pembataswaktuLebsam 00:00 $menit45shubuh ||
buat_pembataswaktuLebsam $pukul_matahariterbit $dhukha ||

# monitor off dilanjutkan
buat_pembataswaktuLebsam $pukulselesaishalatshubuh $pukul_matahariterbit ||
buat_pembataswaktuLebsam $dhukha $menit45zhuhur ||
buat_pembataswaktuLebsam $pukulselesaishalatashar $menit45maghrib ||
buat_pembataswaktuLebsam $pukulselesaishalatmaghrib $menit45isya ||
buat_pembataswaktuLebsam $pukulselesaishalatisya 23:59
